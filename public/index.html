<title>Bish Cleanup</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first app shell. Sticky brand header, one scrolling view, floating bottom tab bar. Wide screens center the view at 760px. */
:root{
  --bg:#f2f6f3; --surface:#ffffff; --surface2:#e8efea; --line:#d3ddd6; --fg:#0e1a14; --muted:#56675d;
  --brand:#047857; --brand-ink:#ffffff; --brand-text:#047857; --brand-soft:#d6f0e3;
  --lime:#ccff00; --lime-ink:#10200a;
  --new:#1d4ed8; --new-soft:#dbe6fd; --quoted:#92400e; --quoted-soft:#fdeccb;
  --sched:#047857; --sched-soft:#d6f0e3; --cancelled:#55615a; --cancelled-soft:#e3e8e5;
  --danger:#b91c1c; --danger-soft:#fde2e2; --scrim:rgba(8,20,14,.55);
  --shadow:0 1px 2px rgba(10,30,20,.06),0 10px 28px rgba(10,30,20,.07);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09100c; --surface:#111a15; --surface2:#1a2720; --line:#26372d; --fg:#e7f0ea; --muted:#95aa9d;
    --brand:#047857; --brand-ink:#ffffff; --brand-text:#3ddc97; --brand-soft:#0f2e22;
    --new:#8db4ff; --new-soft:#14284f; --quoted:#f6c873; --quoted-soft:#3a2a0c;
    --sched:#3ddc97; --sched-soft:#0f2e22; --cancelled:#aab6af; --cancelled-soft:#222d27;
    --danger:#ff8a8a; --danger-soft:#3b1515; --scrim:rgba(0,0,0,.65);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09100c; --surface:#111a15; --surface2:#1a2720; --line:#26372d; --fg:#e7f0ea; --muted:#95aa9d;
  --brand:#047857; --brand-ink:#ffffff; --brand-text:#3ddc97; --brand-soft:#0f2e22;
  --new:#8db4ff; --new-soft:#14284f; --quoted:#f6c873; --quoted-soft:#3a2a0c;
  --sched:#3ddc97; --sched-soft:#0f2e22; --cancelled:#aab6af; --cancelled-soft:#222d27;
  --danger:#ff8a8a; --danger-soft:#3b1515; --scrim:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--surface)}
h1,h2,h3,p,dl,dd,dt,ul{margin:0;padding:0}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px;font-weight:800;line-height:1.1}
h2{font-size:21px;font-weight:800}
h3{font-size:17px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-text)}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);cursor:pointer;border:0;background:none;padding:0}
.mark{width:36px;height:36px;flex:none}
.wm{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1}
.wm em{font-style:normal;font-weight:600;color:var(--brand-text);margin-left:4px}
.top-r{display:flex;align-items:center;gap:8px}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;color:var(--fg)}
.icon-btn:hover{border-color:var(--brand-text)}
.avatar-btn{padding:0;border:2px solid var(--brand-text);border-radius:50%;background:none;cursor:pointer;width:38px;height:38px;overflow:hidden}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;object-fit:cover;overflow:hidden;flex:none}

/* main */
main{max-width:760px;margin:0 auto;padding-block:20px 120px;display:flex;flex-direction:column;gap:16px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-text);margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--fg);min-height:42px;line-height:1.2}
.btn:hover{border-color:var(--brand-text)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand-soft);border-color:var(--brand-text);color:var(--brand-text)}
.chip b{font-variant-numeric:tabular-nums;font-size:12px;opacity:.8}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
input,select,textarea{width:100%;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:15px}
textarea{resize:vertical;min-height:70px}
input::placeholder,textarea::placeholder{color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:0}
.err:empty{display:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.seg button{padding:9px;border:0;border-radius:10px;background:none;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.dim{opacity:.7}
.bk{display:flex;flex-direction:column;gap:12px;cursor:pointer}
.bk:hover{border-color:var(--brand-text)}
.bk-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.bk-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.kind{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-top:2px}
.price{font-family:var(--font-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.slot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--brand-text);font-weight:700}
.slot em{font-style:normal;color:var(--muted);font-weight:500;font-size:12px}
.slot.big{font-size:17px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{min-width:0;overflow-wrap:anywhere;font-weight:600}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-new{background:var(--new-soft);color:var(--new)}
.st-quoted{background:var(--quoted-soft);color:var(--quoted)}
.st-scheduled{background:var(--sched-soft);color:var(--sched)}
.st-cancelled{background:var(--cancelled-soft);color:var(--cancelled)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:14px}
.note.warn{border-color:var(--quoted);background:var(--quoted-soft);color:var(--quoted)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;border-radius:12px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in}
.thumbs .rm{position:relative}
.thumbs .rm button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.empty{text-align:center;padding:36px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .dot{width:52px;height:52px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center}
.empty h3{color:var(--fg)}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dw{font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.cal button{position:relative;aspect-ratio:1;max-height:44px;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.cal button:hover{background:var(--surface2)}
.cal button.today{border-color:var(--brand-text)}
.cal button.sel{background:var(--brand);color:#fff}
.cal button.has::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--brand-text)}
.cal button.sel.has::after{background:var(--lime)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:55;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.nav-in{pointer-events:auto;max-width:620px;margin:0 auto;display:flex;gap:2px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.nav button{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:0;border-radius:18px;background:none;cursor:pointer;color:var(--muted);font-size:10.5px;font-weight:700}
.nav button.on{background:var(--brand-soft);color:var(--brand-text)}
.nav .badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* modal */
.scrim{position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.scrim{align-items:center;padding-bottom:16px}.sheet{border-radius:24px}}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.lightbox{max-width:92vw;max-height:80vh;border-radius:16px}

/* toast */
.toasts{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{pointer-events:auto;max-width:420px;padding:11px 16px;border-radius:14px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.toast.err{background:var(--danger);color:#fff}

/* clock */
.clock{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.clock .time{font-family:var(--font-display);font-weight:800;font-size:54px;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--danger)}
.pill.work{color:var(--sched);background:var(--sched-soft)}.pill.work i{background:var(--sched)}
.pill.lunch,.pill.break{color:var(--quoted);background:var(--quoted-soft)}.pill.lunch i,.pill.break i{background:var(--quoted)}
.clock-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;background:var(--surface2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--line);cursor:default}
.li:first-child{border-top:0}
.li.click{cursor:pointer}.li.click:hover{background:var(--surface2)}
.li .ico{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;flex:none}
.li .ico.bad{background:var(--danger-soft);color:var(--danger)}
.li h4{margin:0;font-size:15px;font-weight:700}
.li p{color:var(--muted);font-size:14px}
.li small{color:var(--muted);font-size:12px}
.li.unread h4::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand-text);margin-left:8px}
.list.card{padding:0;overflow:hidden}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;padding:6px 0}
.bub{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14.5px;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:6px}
.bub small{display:block;font-size:11px;opacity:.75;margin-top:4px}
.compose{display:flex;gap:8px;position:sticky;bottom:calc(88px + env(safe-area-inset-bottom,0px))}

/* auth */
.auth{max-width:460px;margin:0 auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 40px;display:flex;flex-direction:column;gap:20px}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:28px 24px;background:#07281c;color:#fff;display:flex;flex-direction:column;gap:12px;min-height:210px;justify-content:flex-end}
.hero svg.art{position:absolute;right:-30px;top:-30px;width:210px;height:210px;opacity:.9}
.hero .mark{width:54px;height:54px;position:relative}
.hero h1{font-size:34px;position:relative;color:#fff}
.hero p{position:relative;color:#bfe6d3;max-width:32ch}
.hero .lime{color:var(--lime)}

@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}}
</style>

<div id="app"></div>
<div id="modal"></div>

function finishShift(c,end){
  if(c.lunchStart){c.lunchMs+=end-c.lunchStart;c.lunchStart=null}
  if(c.breakStart){c.breakMs+=end-c.breakStart;c.breakStart=null}
  c.endTs=end;c.paidMs=Math.max(0,end-c.inTs-c.lunchMs);

function computeShifts(events,now){
  const ev=events.slice().sort((a,b)=>a.ts-b.ts),out=[];let cur=null;
  for(const e of ev){
    if(e.type==='in'){
      if(cur){finishShift(cur,e.ts);cur.forced=true;out.push(cur)}
      cur={userId:e.userId,name:e.name,inTs:e.ts,outTs:null,lunchMs:0,breakMs:0,lunchStart:null,breakStart:null,open:false};
    }else if(!cur){continue}
    else if(e.type==='lunch_start'){cur.lunchStart=e.ts}
    else if(e.type==='lunch_end'){if(cur.lunchStart){cur.lunchMs+=e.ts-cur.lunchStart;cur.lunchStart=null}}
    else if(e.type==='break_start'){cur.breakStart=e.ts}
    else if(e.type==='break_end'){if(cur.breakStart){cur.breakMs+=e.ts-cur.breakStart;cur.breakStart=null}}
    else if(e.type==='out'){cur.outTs=e.ts;finishShift(cur,e.ts);out.push(cur);cur=null}
  }
  if(cur){const st=cur.lunchStart?'lunch':cur.breakStart?'break':'work';finishShift(cur,now);cur.open=true;cur.state=st;out.push(cur)}
  return out;
}

function errMsg(e){
  const c=e&&e.code;

  if(c==='resource-exhausted')return 'Too many requests at once. Wait a moment and try again.';

// Account docs live at accounts/{lowercase email}. Passwords are held by Firebase Auth, never in Firestore.
function checkNew(o){
  const email=String(o.email||'').trim().toLowerCase(),id=emailKey(email);
  if(!id||id.indexOf('@')<1||id!==email)throw {code:'bademail'};
  if(String(o.password||'').length<8)throw {code:'shortpw'};
  return {email:email,id:id,doc:{name:String(o.name||'').trim(),email:email,role:o.role,tag:tagFromName(o.name),avatar:'',phone:String(o.phone||'').trim(),createdAt:Date.now()}};
}
// Creates the Firebase Auth user and the account doc for the person filling in the form, then leaves them signed in.
async function createAccount(o){
  const n=checkNew(o),ref=S.db.doc('accounts/'+n.id);
  if(o.invite)n.doc.invite=o.invite;
  S.creating=true;
  try{
    try{await S.auth.createUserWithEmailAndPassword(n.email,o.password)}
    catch(e){
      if(!e||e.code!=='auth/email-already-in-use')throw e;
      // A sign-in with no account doc (an earlier signup that stopped halfway) can be finished with the same password.
      try{await S.auth.signInWithEmailAndPassword(n.email,o.password)}catch(x){throw {code:'exists'}}
      const ex=await ref.get();if(ex.exists){await S.auth.signOut();throw {code:'exists'}}
    }
    const b=S.db.batch();b.set(ref,n.doc);
    if(o.role==='admin')b.set(S.db.doc('meta/setup'),{admin:n.id,ts:Date.now()});
    try{await w(()=>b.commit())}catch(e){try{await S.auth.signOut()}catch(x){}throw e}
    return Object.assign({id:n.id},n.doc);
  }finally{S.creating=false}
}
// Admin adds a team member: the login is made on a second Firebase app so the admin stays signed in.
async function createTeamMember(o){
  const n=checkNew(Object.assign({},o,{role:'team'}));
  const app2=firebase.apps.find(a=>a.name==='adder')||firebase.initializeApp(S.cfg,'adder');
  const a2=app2.auth();if(!a2.emulatorConfig)authEmu(a2);
  try{await a2.setPersistence(firebase.auth.Auth.Persistence.NONE)}catch(e){}
  try{await a2.createUserWithEmailAndPassword(n.email,o.password)}
  catch(e){if(e&&e.code==='auth/email-already-in-use')throw {code:'exists'};throw e}
  finally{try{await a2.signOut()}catch(e){}}
  await w(()=>S.db.doc('accounts/'+n.id).set(n.doc));
  return Object.assign({id:n.id},n.doc);
}
function authErr(e){
  const c=e&&e.code;
  if(c==='exists'||c==='auth/email-already-in-use')return 'An account with that email already exists. Sign in instead.';
  if(c==='bademail'||c==='auth/invalid-email')return 'Enter a valid email address.';
  if(c==='shortpw'||c==='auth/weak-password')return 'Use a password with at least 8 characters.';
  if(c==='nouser'||c==='badpw'||c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials')return "That email and password don't match an account.";
  if(c==='auth/too-many-requests')return 'Too many tries. Wait a few minutes and try again.';
  if(c==='auth/network-request-failed')return 'No connection. Check your internet and try again.';
  return errMsg(e);
}

function sub(q,fn,name){
  let first=true;
  const t=setTimeout(()=>{if(first){S.slow=true;scheduleRender()}},10000);
  const un=q.onSnapshot(snap=>{if(first){first=false;clearTimeout(t);if(S.slow){S.slow=false}}fn(snap)},err=>{clearTimeout(t);console.warn(name,err);if(err&&(err.code==='revoked'||err.code==='permission-denied')){S.revoked=true;scheduleRender()}});

let lastRem=0;
function checkReminders(){
  const now=Date.now();if(now-lastRem<20000||!S.me||!S.db)return;lastRem=now;
  S.bookings.forEach(b=>{
    if(b.status!=='scheduled'||b.remindedSlot===b.slotTs)return;
    const d=b.slotTs-now;if(d<=0||d>3600000)return;
    if(!(S.me.role==='admin'||b.assigneeId===S.me.id||b.customerId===S.me.id))return;
    const key=b.id+':'+b.slotTs;if(S.reminding[key])return;S.reminding[key]=1;
    (async()=>{
      try{
        await w(()=>S.db.doc('bookings/'+b.id).update({remindedSlot:b.slotTs}));
        const t='Reminder: '+b.service+' in about an hour';
        await pushAlert('u:'+b.customerId,t,fmtTime(b.slotTs)+' at '+b.address+' with '+(b.tag||'our team'),'reminder',b.id);
        await pushAlert(b.assigneeId?'u:'+b.assigneeId:'staff',t,b.customerName+' · '+fmtTime(b.slotTs)+' · '+b.address,'reminder',b.id);
      }catch(e){delete S.reminding[key]}
    })();
  });
}

function loadImg(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=fr.result};fr.readAsDataURL(file)})}
async function shrink(file,max,q,square,cap){
  const im=await loadImg(file);let w0=im.naturalWidth,h0=im.naturalHeight,sx=0,sy=0,sw=w0,sh=h0;
  if(square){const s=Math.min(w0,h0);sx=(w0-s)/2;sy=(h0-s)/2;sw=sh=s;w0=h0=s}
  let scale=Math.min(1,max/Math.max(w0,h0)),out='';
  for(let i=0;i<5;i++){
    const c=document.createElement('canvas');c.width=Math.round(w0*scale);c.height=Math.round(h0*scale);
    c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);
    out=c.toDataURL('image/jpeg',q);if(out.length<=cap)break;q=Math.max(.4,q-.1);scale*=.85;
  }
  return out;
}

async function formSubmit(name,form){
  const btn=form.querySelector('button[type=submit]');if(btn)btn.disabled=true;
  const v=id=>($('#'+id)||{value:''}).value;
  try{
    if(name==='login'){await signIn(v('li-email'),v('li-pw'))}
    else if(name==='signup'){
      const a=await createAccount({name:v('su-name'),email:v('su-email'),phone:v('su-phone'),password:v('su-pw'),role:'customer'});
      await pushMessage(a.id,a.name,'Hi '+a.name.split(' ')[0]+'! Welcome to Bish Cleanup. We handle property upkeep and handyman work in Lewis, Cowlitz, Clark and Thurston counties. Request a quote any time and we will confirm a price and time.',true);
      await loadMe(S.auth.currentUser);
    }
    else if(name==='setup'){
      const a=await createAccount({name:v('st-name'),email:v('st-email'),phone:v('st-phone'),password:v('st-pw'),role:'admin'});
      if(v('st-phone').trim())await w(()=>S.db.doc('settings/main').set({phone:v('st-phone').trim()},{merge:true}));
      await loadMe(S.auth.currentUser);
    }
    else if(name==='join'){
      const iv=await S.db.doc('invites/'+S.joinToken).get();if(!iv.exists)throw {code:'noinvite'};
      const a=await createAccount({name:v('jn-name'),email:v('jn-email'),phone:v('jn-phone'),password:v('jn-pw'),role:'team',invite:S.joinToken});
      S.joinToken=null;try{location.hash=''}catch(e){}
      await loadMe(S.auth.currentUser);
    }
  }catch(e){
    if(e&&e.code==='noinvite')authError('This signup link is no longer active.');else authError(authErr(e));
    if(btn)btn.disabled=false;
  }
}

/* ---------- slot picker ---------- */
function slotDefault(ts){const d=ts?new Date(ts):new Date();const day=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();return {day:day,hour:ts?d.getHours():null}}
function slotTs(){if(M.slot.hour==null)return null;const t=new Date(M.slot.day);t.setHours(M.slot.hour,0,0,0);return t.getTime()}
function slotHTML(){
  const base=new Date();base.setHours(0,0,0,0);const days=[];
  for(let i=0;i<21;i++){const d=new Date(base);d.setDate(base.getDate()+i);days.push(d)}
  if(M.slot.day>days[days.length-1].getTime()||M.slot.day<days[0].getTime())days.unshift(new Date(M.slot.day));
  const dchips=days.map(d=>'<button type="button" class="chip '+(d.getTime()===M.slot.day?'on':'')+'" data-action="slot-day" data-ts="'+d.getTime()+'"><span>'+d.toLocaleDateString([],{weekday:'short'})+'</span><b>'+d.getDate()+'</b></button>').join('');
  const tchips=HOURS.map(h=>{const t=new Date(M.slot.day);t.setHours(h,0,0,0);const past=t.getTime()<Date.now()+1800000&&!(M.allowPast);return '<button type="button" class="chip '+(M.slot.hour===h?'on':'')+'" data-action="slot-hour" data-h="'+h+'" '+(past?'disabled':'')+'>'+t.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'</button>'}).join('');
  return '<div class="lbl">Day</div><div class="chips">'+dchips+'</div><div class="lbl" style="margin-top:8px">Time slot</div><div class="chips" style="flex-wrap:wrap">'+tchips+'</div>';
}

function conflictFor(b,tag,ts){
  return S.bookings.find(o=>o.id!==b.id&&o.status==='scheduled'&&o.tag===tag&&Math.abs(o.slotTs-ts)<SLOT_MS);
}
async function savePrice(form){
  const id=form.dataset.id,b=S.bookings.find(x=>x.id===id),err=m=>{$('#pr-err').textContent=m};if(!b)return;
  const stage=$('#pr-stage').value,price=parseFloat($('#pr-price').value),whoId=isAdmin()?$('#pr-who').value:S.me.id;
  if(stage!=='new'&&!(price>=0)){err('Enter a price before sending a quote or confirming.');return}
  const who=S.accounts.find(a=>a.id===whoId)||S.me,tag=who.tag||tagFromName(who.name);
  if(stage==='scheduled'){const c=conflictFor(b,tag,b.slotTs);if(c){err(tag+' already has a scheduled job for '+c.customerName+' at '+fmtSlot(c.slotTs)+'. Pick another name tag or adjust the time slot.');return}}
  const btn=form.querySelector('button[type=submit]');btn.disabled=true;
  const p=isNaN(price)?0:price;
  try{
    await w(()=>S.db.doc('bookings/'+id).update({price:p,status:stage,tag:tag,assigneeId:whoId,confirmedAt:Date.now()}));
    if(stage!=='new'){
      const what=stage==='scheduled'?'booking':'quote',line=tag+' confirmed your '+b.service+' '+what+' — '+money(p);
      await pushAlert('u:'+b.customerId,stage==='scheduled'?'Booking confirmed':'Your quote is ready',line+' · '+fmtSlot(b.slotTs),'confirm',id);
      await pushAlert('staff',stage==='scheduled'?'Booking confirmed':'Quote sent',b.customerName+' · '+b.service+' · '+money(p)+' · '+tag,'confirm',id);
      await pushMessage(b.customerId,b.customerName,line+'. '+fmtSlot(b.slotTs)+'.',false);
    }
    closeModal(true);toast('Saved'+(stage!=='new'?' and customer alerted.':'.'));
  }catch(e){err(errMsg(e));btn.disabled=false}
}
function openSlot(id){

    '<div class="sh-head"><h2>Adjust time slot</h2><button class="icon-btn" data-action="close-modal" aria-label="Close">'+ic('x')+'</button></div>'+

async function saveSlot(form){

  const ts=slotTs();if(ts==null){err('Pick a time slot.');return}

/* ---------- time clock ---------- */
function myEvents(){return S.logs.filter(l=>l.userId===S.me.id)}
function myState(){
  const ev=myEvents().sort((a,b)=>a.ts-b.ts),last=ev[ev.length-1];
  if(!last||last.type==='out')return 'out';

  if(last.type==='break_start')return 'break';

}
function openShift(){const s=computeShifts(myEvents(),Date.now());const o=s[s.length-1];return o&&o.open?o:null}
function viewClock(){
  const st=myState(),sh=openShift();
  const label={out:'Clocked out',work:'Clocked in',lunch:'On lunch',break:'On a break'}[st];
  const btns={
    out:[['clock-in','Clock in','primary','clock']],
    work:[['lunch_start','Lunch out','','clock'],['break_start','Short break','','clock'],['out','Clock out','danger','logout']],
    lunch:[['lunch_end','Back from lunch','primary','check'],['out','Clock out','danger','logout']],

  }[st].map(b=>'<button class="btn '+b[2]+'" data-action="clock" data-type="'+(b[0]==='clock-in'?'in':b[0])+'">'+ic(b[3])+'<span>'+b[1]+'</span></button>').join('');

   '<div class="card clock"><span class="pill '+(st==='out'?'':st)+'" id="clockPill"><i></i>'+label+'</span><div class="time" id="clockTime">'+hm2(sh?sh.paidMs:0)+'</div><p class="sub" id="clockSub">'+(sh?'Since '+fmtTime(sh.inTs)+' · lunch is unpaid':'Tap Clock in to start your shift')+'</p><div class="clock-btns">'+btns+'</div></div>'+

function hm2(ms){const s=Math.floor(Math.max(0,ms)/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}
function tickClock(){
  const t=$('#clockTime');if(!t||!S.me||S.view!=='clock')return;
  const sh=openShift();t.textContent=hm2(sh?sh.paidMs:0);
}
async function clockAct(type){
  if(S.busy)return;S.busy=true;
  try{await w(()=>S.db.collection('timelogs').add({userId:S.me.id,name:S.me.name,tag:S.me.tag||'',type:type,ts:Date.now()}));
    toast({in:'Clocked in.',out:'Clocked out.',lunch_start:'Lunch started.',lunch_end:'Back from lunch.',break_start:'Break started.',break_end:'Break ended.'}[type])}
  catch(e){toast(errMsg(e),'err')}
  S.busy=false;
}
function periodRange(){
  const now=new Date(),sod=new Date(now.getFullYear(),now.getMonth(),now.getDate());let s,e,lab;
  if(S.period==='lastweek'){e=new Date(sod);e.setDate(e.getDate()-e.getDay());s=new Date(e);s.setDate(s.getDate()-7);lab='Last week'}
  else if(S.period==='month'){s=new Date(now.getFullYear(),now.getMonth(),1);e=new Date(now.getFullYear(),now.getMonth()+1,1);lab='This month'}
  else if(S.period==='lastmonth'){s=new Date(now.getFullYear(),now.getMonth()-1,1);e=new Date(now.getFullYear(),now.getMonth(),1);lab='Last month'}
  else if(S.period==='custom'&&S.cFrom&&S.cTo){const f=S.cFrom.split('-'),t=S.cTo.split('-');s=new Date(+f[0],+f[1]-1,+f[2]);e=new Date(+t[0],+t[1]-1,+t[2]+1);lab='Custom range'}
  else{s=new Date(sod);s.setDate(s.getDate()-s.getDay());e=new Date(s);e.setDate(e.getDate()+7);lab='This week'}
  return [s.getTime(),e.getTime(),lab];
}
function shiftsInPeriod(){
  const r=periodRange(),by={};S.logs.forEach(l=>{(by[l.userId]=by[l.userId]||[]).push(l)});
  let all=[];Object.keys(by).forEach(u=>{all=all.concat(computeShifts(by[u],Date.now()))});
  return all.filter(s=>s.inTs>=r[0]&&s.inTs<r[1]).sort((a,b)=>b.inTs-a.inTs);
}
function shiftRow(s,withName,admin){

}
function myHours(){
  const s=computeShifts(myEvents(),Date.now()).filter(x=>x.inTs>=periodRange()[0]&&x.inTs<periodRange()[1]).sort((a,b)=>b.inTs-a.inTs);

}
function adminHours(){

   '<div class="two"><label class="field"><span>Pay period</span><select data-change="period">'+[['week','This week'],['lastweek','Last week'],['month','This month'],['lastmonth','Last month'],['custom','Custom range']].map(f).join('')+'</select></label>'+
   (S.period==='custom'?'<div class="two"><label class="field"><span>From</span><input type="date" data-change="cfrom" value="'+esc(S.cFrom)+'"></label><label class="field"><span>To</span><input type="date" data-change="cto" value="'+esc(S.cTo)+'"></label></div>':'')+'</div>'+
   (names.length?'<div class="tbl-wrap"><table style="min-width:360px"><thead><tr><th>Team member</th><th class="num">Shifts</th><th class="num">Paid hours</th></tr></thead><tbody>'+names.map(u=>'<tr><td><b>'+esc(tot[u].name)+'</b></td><td class="num">'+tot[u].n+'</td><td class="num"><b>'+(tot[u].ms/3600000).toFixed(2)+'</b></td></tr>').join('')+'</tbody></table></div>':'')+
   (sh.length?'<div class="tbl-wrap"><table><thead><tr><th>Team member</th><th>Date</th><th>In</th><th>Out</th><th class="num">Lunch</th><th class="num">Breaks</th><th class="num">Paid hrs</th><th></th></tr></thead><tbody>'+sh.map(x=>shiftRow(x,true,true)).join('')+'</tbody></table></div>':'<p class="sub">No shifts in this period.</p>')+

async function exportCsv(kind){
  const sh=shiftsInPeriod().slice().sort((a,b)=>a.inTs-b.inTs),r=periodRange();let rows;
  const dec=ms=>(ms/3600000).toFixed(2);
  if(kind==='detail'){
    rows=[['Team member','Email','Date','Clock in','Clock out','Lunch (min)','Breaks (min)','Paid hours']].concat(sh.map(s=>[s.name,s.userId,dayKey(s.inTs),fmtTime(s.inTs),s.open?'Still clocked in':fmtTime(s.endTs),Math.round(s.lunchMs/60000),Math.round(s.breakMs/60000),dec(s.paidMs)]));
  }else{

    rows=[['Team member','Email','Shifts','Paid hours']].concat(Object.keys(t).sort().map(u=>[t[u].name,u,t[u].n,dec(t[u].ms)]));
  }

}

  const name=isStaff()?((threads().find(x=>x.id===S.thread)||{}).name||S.threadName||'Customer'):S.me.name;
  try{await w(()=>S.db.collection('messages').add({threadId:S.thread,threadName:name,text:t,fromId:S.me.id,fromName:S.me.name,fromRole:S.me.role,tag:S.me.tag||'',ts:Date.now(),auto:false}));
    if(!isStaff())await pushAlert('staff','New message',S.me.name+': '+t.slice(0,80),'msg');
    else await pushAlert('u:'+S.thread,'New message from '+(S.me.tag||'Bish Cleanup'),t.slice(0,80),'msg');
  }catch(e){toast(errMsg(e),'err');i.value=t}
}

/* ---------- alerts ---------- */
function viewAlerts(){
  const l=S.alerts.filter(a=>a.ts>S.clearedBefore).sort((a,b)=>b.ts-a.ts);
  const seen=S.seenAlerts;
  const icon={new:'calendar',confirm:'check',cancel:'x',reminder:'bell',moved:'clock',msg:'chat'};
  return '<div class="vh"><div><p class="eyebrow">Live feed</p><h1>Alerts</h1></div>'+(l.length?'<button class="btn sm" data-action="clear-alerts">Clear all</button>':'')+'</div>'+
   (l.length?'<div class="list card">'+l.map(a=>'<div class="li '+(a.bookingId?'click':'')+'" '+(a.bookingId?'data-action="open-booking" data-id="'+esc(a.bookingId)+'" tabindex="0" role="button"':'')+'><span class="ico '+(a.kind==='cancel'?'bad':'')+'">'+ic(icon[a.kind]||'bell')+'</span><div class="grow"><h4>'+esc(a.title)+'</h4><p>'+esc(a.detail)+'</p><small>'+esc(fmtStamp(a.ts))+'</small></div></div>').join('')+'</div>':emptyState('No alerts','New quote requests, confirmations and reminders show up here.','bell'));
}

/* ---------- profile ---------- */
function viewProfile(){
  const m=S.me,roleLab={admin:'Admin',team:'Team',customer:'Customer'}[m.role];
  return '<div class="card row" style="gap:16px;flex-wrap:nowrap"><div style="position:relative">'+avatar(m,72)+'<label class="icon-btn" style="position:absolute;right:-6px;bottom:-6px;width:32px;height:32px;cursor:pointer" aria-label="Change profile picture">'+ic('camera')+'<input type="file" accept="image/*" class="sr" data-change="avatar"></label></div><div class="grow"><h2>'+esc(m.name)+'</h2><p class="sub" style="overflow-wrap:anywhere">'+esc(m.email)+'</p><span class="st st-scheduled" style="margin-top:6px">'+roleLab+(m.tag?' · '+esc(m.tag):'')+'</span></div></div>'+
  '<div class="card stack"><h3>Appearance</h3><div class="seg" role="group" aria-label="Theme">'+['system','light','dark'].map(t=>'<button class="'+(S.theme===t?'on':'')+'" data-action="theme" data-t="'+t+'">'+t[0].toUpperCase()+t.slice(1)+'</button>').join('')+'</div></div>'+
  '<form class="card form" data-form="name"><h3>Your name</h3>'+fld('pf-name','Full name','text','value="'+esc(m.name)+'" required')+fld('pf-tag','Name tag on confirmations','text','value="'+esc(m.tag||'')+'" maxlength="24"')+'<p class="sub" style="margin-top:-6px">Customers see this on confirmations, like John D.</p>'+fld('pf-phone','Phone','tel','value="'+esc(m.phone||'')+'"')+'<button class="btn primary block" type="submit">Save</button></form>'+
  (isAdmin()?'<form class="card form" data-form="office"><h3>Office phone</h3><p class="sub">Customers call or text this number to cancel or reschedule.</p>'+fld('pf-office','Office phone','tel','value="'+esc(S.settings.phone||'')+'" placeholder="(360) 555-0100"')+'<button class="btn block" type="submit">Save office phone</button></form><div class="card list" style="padding:0"><div class="li click" data-action="go" data-view="team" tabindex="0" role="button"><span class="ico">'+ic('users')+'</span><div class="grow"><h4>Team members &amp; roles</h4><p>Add staff, change roles, manage signup links</p></div>'+ic('chev')+'</div></div>':'')+
  '<form class="card form" data-form="pw"><h3>Change password</h3>'+fld('pw-cur','Current password','password','autocomplete="current-password" required')+fld('pw-new','New password (8+ characters)','password','autocomplete="new-password" minlength="8" required')+'<p class="err" id="pw-err" role="alert"></p><button class="btn block" type="submit">Update password</button></form>'+
  '<button class="btn danger block" data-action="logout">'+ic('logout')+'<span>Log out</span></button>';
}
async function saveName(form){
  const name=$('#pf-name').value.trim(),tag=($('#pf-tag').value.trim()||tagFromName(name)),phone=$('#pf-phone').value.trim();
  if(!name){toast('Enter your name.','err');return}
  try{await w(()=>S.db.doc('accounts/'+S.me.id).update({name:name,tag:tag,phone:phone}));toast('Saved.')}catch(e){toast(errMsg(e),'err')}
}
async function savePw(form){
  const e=m=>{$('#pw-err').textContent=m},cur=$('#pw-cur').value,nw=$('#pw-new').value;
  if(nw.length<8){e('Use at least 8 characters.');return}
  try{
    const u=S.auth.currentUser;if(!u){logout();return}
    try{await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,cur))}
    catch(x){const c=x&&x.code;if(c==='auth/wrong-password'||c==='auth/invalid-credential'||c==='auth/invalid-login-credentials'){e('Current password is not right.');return}throw x}
    await u.updatePassword(nw);
    form.reset();e('');toast('Password updated.');
  }catch(x){e(authErr(x))}
}
async function saveAvatar(file){
  try{const d=await shrink(file,192,.8,true,30000);await w(()=>S.db.doc('accounts/'+S.me.id).update({avatar:d}));toast('Profile picture saved.');if(M.blocking){M.blocking=false;closeModal(true)}}
  catch(e){toast(e&&e.code?errMsg(e):"Couldn't read that picture.",'err')}
}
function ensureAvatarGate(){
  if(!S.me||S.me.role!=='team'||S.me.avatar||M.blocking||$('#modal .scrim'))return;
  openModal('<h2>Add your profile picture</h2><p class="sub">Team members need a photo so customers know who is coming. You can change it later in Profile.</p><div style="display:grid;place-items:center;padding:8px 0">'+avatar(S.me,96)+'</div><label class="btn primary block" style="cursor:pointer">'+ic('camera')+'<span>Choose a photo</span><input type="file" accept="image/*" class="sr" data-change="avatar"></label><button class="btn block" data-action="logout">Log out</button>',{blocking:true,noFocus:true});
}

/* ---------- team & roles (admin) ---------- */
const baseUrl=()=>(S.settings.baseUrl||location.href.split('#')[0]);
const inviteUrl=t=>baseUrl()+'#join-'+t;
function viewTeam(){
  const q=S.teamQ.trim().toLowerCase();
  const l=S.accounts.filter(a=>!q||a.name.toLowerCase().indexOf(q)>=0||a.email.toLowerCase().indexOf(q)>=0).sort((a,b)=>a.name.localeCompare(b.name));
  return '<div class="row"><button class="icon-btn" data-action="go" data-view="profile" aria-label="Back">'+ic('back')+'</button><div><p class="eyebrow">User management</p><h1>Team &amp; roles</h1></div></div>'+
  '<div class="card stack"><div class="row" style="justify-content:space-between"><h3>Signup links</h3><button class="btn sm primary" data-action="new-invite">'+ic('plus')+'<span>Create link</span></button></div><p class="sub">Anyone with a link joins with the Team role. A link works until you delete it.</p>'+
   (S.invites.length?S.invites.sort((a,b)=>b.createdAt-a.createdAt).map(i=>'<div class="stack" style="gap:8px"><input readonly id="inv-'+esc(i.id)+'" value="'+esc(inviteUrl(i.id))+'" aria-label="Signup link" onfocus="this.select()"><div class="row"><button class="btn sm" data-action="copy-el" data-el="inv-'+esc(i.id)+'">'+ic('copy')+'<span>Copy link</span></button><button class="btn sm danger" data-action="del-invite" data-id="'+esc(i.id)+'">'+ic('trash')+'<span>Delete link</span></button><small class="sub">Created '+esc(fmtStamp(i.createdAt))+'</small></div></div>').join(''):'<p class="sub">No active signup links.</p>')+
   '<label class="field"><span>Page address used in links</span><input data-change="baseurl" value="'+esc(baseUrl())+'" aria-label="Page address"></label></div>'+
  '<form class="card form" data-form="addteam"><h3>Add a team member</h3><p class="sub">Team members can see bookings, set prices, confirm and message customers.</p>'+fld('tm-name','First and last name','text','required')+fld('tm-email','Email','email','required')+fld('tm-pw','Temporary password (8+ characters)','password','minlength="8" required autocomplete="new-password"')+'<p class="err" id="tm-err" role="alert"></p><button class="btn primary block" type="submit">'+ic('plus')+'<span>Add team member</span></button></form>'+
  '<div class="stack"><h3>Everyone</h3><input data-input="teamq" placeholder="Search by name or email" value="'+esc(S.teamQ)+'" aria-label="Search people"><div class="stack" id="roster">'+rosterHTML(l)+'</div></div>';
}
function rosterHTML(l){
  return l.map(a=>'<div class="card flat row" style="justify-content:space-between;flex-wrap:nowrap">'+avatar(a,40)+'<div class="grow"><b>'+esc(a.name)+'</b><p class="sub" style="overflow-wrap:anywhere">'+esc(a.email)+'</p></div>'+(a.role==='admin'?'<span class="st st-scheduled">Admin</span>':'<div class="seg"><button class="'+(a.role==='team'?'on':'')+'" data-action="set-role" data-id="'+esc(a.id)+'" data-role="team">Team</button><button class="'+(a.role==='customer'?'on':'')+'" data-action="set-role" data-id="'+esc(a.id)+'" data-role="customer">Customer</button></div>')+'</div>').join('')||'<p class="sub">No one matches.</p>';
}
async function addTeam(form){
  const e=m=>{$('#tm-err').textContent=m};
  const btn=form.querySelector('button[type=submit]');if(btn)btn.disabled=true;
  try{await createTeamMember({name:$('#tm-name').value,email:$('#tm-email').value,password:$('#tm-pw').value});form.reset();e('');toast('Team member added. They add a photo on first sign in.')}
  catch(x){e(authErr(x))}
  if(btn)btn.disabled=false;
}

/* ---------- actions ---------- */
async function copyEl(id){
  const el=document.getElementById(id);if(!el)return;
  const text='value' in el?el.value:el.textContent;
  try{await navigator.clipboard.writeText(text);toast('Copied.')}catch(e){try{el.focus();el.select();toast('Selected. Press copy on your keyboard.')}catch(x){}}
}
const A={
  noop(){return 'native'},
  go(el){go(el.dataset.view)},
  'auth-tab'(el){S.authTab=el.dataset.tab;renderAuth()},
  'auth-home'(){S.joinToken=null;try{location.hash=''}catch(e){}renderAuth()},
  logout(){logout()},
  'theme-toggle'(){applyTheme(isDarkNow()?'light':'dark');updateChrome()},
  theme(el){applyTheme(el.dataset.t);updateChrome();if(S.view==='profile')renderView()},
  filter(el){S.filter=el.dataset.f;renderView()},
  'pick-day'(el){S.selDay=S.selDay===el.dataset.day?null:el.dataset.day;renderView()},
  'clear-day'(){S.selDay=null;renderView()},
  'cal-nav'(el){let m=S.cal.m+Number(el.dataset.d),y=S.cal.y;if(m<0){m=11;y--}if(m>11){m=0;y++}S.cal={y:y,m:m};renderView()},
  'new-request'(){openRequest()},
  'open-booking'(el){openBooking(el.dataset.id)},
  'close-modal'(){closeModal()},
  photo(el){openModal('<div class="sh-head"><span></span><button class="icon-btn" data-action="close-modal" aria-label="Close">'+ic('x')+'</button></div><img class="lightbox" src="'+esc(el.getAttribute('src'))+'" alt="Job photo">')},
  'rm-photo'(el){M.photos.splice(Number(el.dataset.i),1);drawPhotos()},
  'slot-day'(el){M.slot.day=Number(el.dataset.ts);M.slot.hour=null;redrawSlot()},
  'slot-hour'(el){M.slot.hour=Number(el.dataset.h);redrawSlot()},
  'price-modal'(el){openPrice(el.dataset.id)},
  'slot-modal'(el){openSlot(el.dataset.id)},
  'cancel-modal'(el){openCancel(el.dataset.id)},
  'do-cancel'(el){doCancel(el.dataset.id)},
  'dismiss-rem'(el){S.dismissed[el.dataset.key]=1;renderView()},
  mine(el){S.mineOnly=el.dataset.v==='1';renderView()},
  clock(el){clockAct(el.dataset.type)},
  'close-shift'(el){if(S.busy)return;S.busy=true;w(()=>S.db.collection('timelogs').add({userId:el.dataset.uid,name:el.dataset.name,type:'out',ts:Date.now(),manual:true,by:S.me.id})).then(()=>toast('Shift closed.')).catch(e=>toast(errMsg(e),'err')).then(()=>{S.busy=false})},
  export(el){exportCsv(el.dataset.kind)},
  'open-thread'(el){S.thread=el.dataset.id;S.threadName=el.dataset.name;S.view='messages';closeModal(true);renderView();updateChrome();window.scrollTo(0,0)},
  'thread-back'(){S.thread=null;renderView()},
  'clear-alerts'(){S.clearedBefore=Date.now();ls.set('bish.cleared.'+S.me.id,String(S.clearedBefore));renderView();updateChrome()},
  'copy-el'(el){copyEl(el.dataset.el)},
  'new-invite'(){const t=rid()+Math.random().toString(36).slice(2,6);w(()=>S.db.doc('invites/'+t).set({createdAt:Date.now(),createdBy:S.me.id})).then(()=>toast('Signup link created.')).catch(e=>toast(errMsg(e),'err'))},
  'del-invite'(el){w(()=>S.db.doc('invites/'+el.dataset.id).delete()).then(()=>toast('Link deleted. It no longer works.')).catch(e=>toast(errMsg(e),'err'))},
  'set-role'(el){w(()=>S.db.doc('accounts/'+el.dataset.id).update({role:el.dataset.role})).then(()=>toast('Role updated.')).catch(e=>toast(errMsg(e),'err'))}
};
const FORMS={
  login:f=>formSubmit('login',f),signup:f=>formSubmit('signup',f),setup:f=>formSubmit('setup',f),join:f=>formSubmit('join',f),
  request:submitRequest,price:savePrice,slot:saveSlot,send:sendMsg,name:saveName,pw:savePw,addteam:addTeam,
  office:async f=>{try{await saveSettings({phone:$('#pf-office').value.trim()});toast('Office phone saved.')}catch(e){toast(errMsg(e),'err')}}
};
async function saveSettings(patch){
  await w(()=>S.db.doc('settings/main').set(patch,{merge:true}));
}
document.addEventListener('click',e=>{
  if(e.target.hasAttribute&&e.target.hasAttribute('data-scrim')){closeModal();return}
  const el=e.target.closest('[data-action]');if(!el)return;
  const fn=A[el.dataset.action];if(!fn)return;
  const r=fn(el,e);if(r!=='native')e.preventDefault();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal .scrim'))closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-action]')){e.preventDefault();e.target.click()}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const fn=FORMS[f.dataset.form];if(fn)fn(f);
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.input;if(!k)return;
  if(k==='msgq'){S.msgQ=t.value;const l=$('#threadlist');if(l)l.innerHTML=threadListHTML()}
  if(k==='teamq'){S.teamQ=t.value;const q=S.teamQ.trim().toLowerCase();const r=$('#roster');if(r)r.innerHTML=rosterHTML(S.accounts.filter(a=>!q||a.name.toLowerCase().indexOf(q)>=0||a.email.toLowerCase().indexOf(q)>=0).sort((a,b)=>a.name.localeCompare(b.name)))}
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset&&t.dataset.change;if(!k)return;
  if(k==='photos')addPhotos(t);
  else if(k==='avatar'){if(t.files&&t.files[0])saveAvatar(t.files[0]);t.value=''}
  else if(k==='period'){S.period=t.value;renderView()}
  else if(k==='cfrom'){S.cFrom=t.value;renderView()}
  else if(k==='cto'){S.cTo=t.value;renderView()}
  else if(k==='baseurl'){saveSettings({baseUrl:t.value.trim()}).then(()=>toast('Page address saved.')).catch(e=>toast(errMsg(e),'err'))}
});
window.addEventListener('hashchange',()=>{readHash();if(!S.me&&S.db)renderAuth()});
function readHash(){const m=/^#join-([A-Za-z0-9]+)$/.exec(location.hash||'');S.joinToken=m?m[1]:null}

/* ---------- boot ---------- */
// On Firebase Hosting the web config is served at /__/firebase/init.json.
// Anywhere else, paste the config from Firebase console > Project settings > Your apps into FIREBASE_CONFIG.
const FIREBASE_CONFIG=null;
async function loadConfig(){
  if(FIREBASE_CONFIG)return FIREBASE_CONFIG;
  try{const r=await fetch('/__/firebase/init.json',{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}
  return null;
}
// Local testing: a demo-* project on localhost talks to the Firebase emulators.
const useEmu=()=>/^demo-/.test((S.cfg&&S.cfg.projectId)||'')&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
function authEmu(a){if(useEmu())a.useEmulator('http://'+location.hostname+':9099',{disableWarnings:true})}
async function boot(){
  applyTheme(S.theme);readHash();S.authTab='login';
  $('#app').innerHTML='<div class="auth">'+heroHTML('Bish <span class="lime">Cleanup</span>',TAGLINE)+'<div class="card"><p class="sub">Loading…</p></div></div>';
  if(!window.firebase||!firebase.initializeApp){noDb('The app could not load. Check your internet connection and reload.');return}
  const cfg=await loadConfig();
  if(!cfg||!cfg.apiKey){noDb('This copy of Bish Cleanup is not connected to Firebase yet. Open it from its Firebase Hosting address, or add the Firebase web config to FIREBASE_CONFIG in index.html.');return}
  S.cfg=cfg;
  try{
    firebase.initializeApp(cfg);
    S.auth=firebase.auth();S.db=firebase.firestore();
    if(useEmu())S.db.useEmulator(location.hostname,8080);
    authEmu(S.auth);
  }catch(e){console.warn(e);noDb('The app could not connect to Firebase. Reload to try again.');return}
  ls.del('bish.session');
  S.auth.onAuthStateChanged(onAuth);
}
function noDb(msg){
  $('#app').innerHTML='<div class="auth">'+heroHTML('Bish <span class="lime">Cleanup</span>',TAGLINE)+'<div class="card"><div class="note warn">'+ic('x')+'<span>'+esc(msg)+'</span></div></div></div>';
}
boot();
})();
</script>
